<div id="mode-selector-bar" {% if is_oob %}hx-swap-oob="true"{% endif %} class="flex items-center p-0.5 rounded-full bg-slate-200/70 dark:bg-white/5 border border-slate-300/60 dark:border-white/10 text-xs font-semibold shadow-inner">
    <form hx-post="{% url 'simulator:set_prospecting_mode' %}" hx-target="#chat-container" hx-swap="innerHTML" class="inline">
        {% csrf_token %}
        <input type="hidden" name="mode" value="RANDOM">
        <button type="submit" title="Modo Aleatorio (Alterna entre casas y tiendas)" class="px-2.5 py-1 rounded-full transition flex items-center gap-1.5 cursor-pointer {% if prospecting_mode == 'RANDOM' %}bg-white dark:bg-teal-500/20 text-teal-700 dark:text-teal-300 shadow-xs border border-slate-200/80 dark:border-teal-500/30{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white{% endif %}">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <span class="hidden sm:inline">Aleatorio</span>
        </button>
    </form>
    <form hx-post="{% url 'simulator:set_prospecting_mode' %}" hx-target="#chat-container" hx-swap="innerHTML" class="inline">
        {% csrf_token %}
        <input type="hidden" name="mode" value="DOOR">
        <button type="submit" title="Modo Puerta a Puerta (Residencial)" class="px-2.5 py-1 rounded-full transition flex items-center gap-1.5 cursor-pointer {% if prospecting_mode == 'DOOR' %}bg-white dark:bg-teal-500/20 text-teal-700 dark:text-teal-300 shadow-xs border border-slate-200/80 dark:border-teal-500/30{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white{% endif %}">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            <span class="hidden sm:inline">Puerta</span>
        </button>
    </form>
    <form hx-post="{% url 'simulator:set_prospecting_mode' %}" hx-target="#chat-container" hx-swap="innerHTML" class="inline">
        {% csrf_token %}
        <input type="hidden" name="mode" value="STORE">
        <button type="submit" title="Modo Puerta de Tienda (Kiosco Retail)" class="px-2.5 py-1 rounded-full transition flex items-center gap-1.5 cursor-pointer {% if prospecting_mode == 'STORE' %}bg-white dark:bg-teal-500/20 text-teal-700 dark:text-teal-300 shadow-xs border border-slate-200/80 dark:border-teal-500/30{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white{% endif %}">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            <span class="hidden sm:inline">Tienda</span>
        </button>
    </form>
</div>
