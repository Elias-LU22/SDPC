{% load static %}
<!DOCTYPE html>
<html lang="{{ language|default:'es' }}" class="h-full antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TXU Energy - Simulador de Ventas y Asesoría Comercial{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/txu_door_logo.svg' %}">
    <link rel="alternate icon" href="{% static 'img/txu_door_logo.svg' %}">
    <!-- Script de Inicialización Temprana: Modo Claro es el predeterminado -->
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('txu_theme');
                if (saved === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN con Dark Mode por Clase -->
    <script>
        (function() {
            const origWarn = console.warn;
            console.warn = function(...args) {
                if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) {
                    return;
                }
                origWarn.apply(console, args);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        teal: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                            950: '#042f2e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Motor de Voz e Intercomunicador Puerta a Puerta -->
    <script src="{% static 'js/voice_intercom.js' %}"></script>
    <style>
        /* Adaptación móvil y altura de pantalla dinámica (100dvh) */
        html, body {
            height: 100%;
            height: 100dvh;
        }
        @media (max-width: 640px) {
            body {
                overflow: hidden;
            }
        }

        /* Base: Modo Claro (Predeterminado) */
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f1f5f9;
            background-image:
                radial-gradient(ellipse 90% 55% at 50% -15%, rgba(20, 184, 166, 0.14), transparent 70%),
                radial-gradient(ellipse 70% 45% at 90% 90%, rgba(59, 130, 246, 0.10), transparent 70%),
                radial-gradient(ellipse 60% 40% at 10% 80%, rgba(13, 148, 136, 0.08), transparent 70%),
                radial-gradient(ellipse 40% 30% at 50% 50%, rgba(255, 255, 255, 0.7), transparent);
            background-attachment: fixed;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Modo Oscuro */
        html.dark body {
            background-color: #070913;
            background-image:
                radial-gradient(ellipse 90% 55% at 50% -15%, rgba(20, 184, 166, 0.18), transparent 70%),
                radial-gradient(ellipse 70% 45% at 90% 90%, rgba(30, 58, 138, 0.22), transparent 70%),
                radial-gradient(ellipse 60% 40% at 10% 80%, rgba(13, 148, 136, 0.12), transparent 70%),
                radial-gradient(ellipse 40% 30% at 50% 50%, rgba(15, 23, 42, 0.5), transparent);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.55);
        }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
        }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        /* Efectos Liquid Glass (iOS Frosted Glass) - Modo Claro */
        .liquid-window {
            background: rgba(255, 255, 255, 0.76);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 
                0 24px 60px -12px rgba(15, 23, 42, 0.10),
                0 0 0 1px rgba(15, 23, 42, 0.04),
                inset 0 1px 1px 0 rgba(255, 255, 255, 1);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Liquid Glass - Modo Oscuro */
        html.dark .liquid-window {
            background: rgba(13, 18, 32, 0.72);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 
                0 32px 72px -16px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 255, 255, 0.04),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.14);
        }

        /* Tarjeta de Contenido / Mensajes - Modo Claro */
        .liquid-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.85);
            box-shadow: 
                0 4px 16px -2px rgba(15, 23, 42, 0.04),
                inset 0 1px 0 0 rgba(255, 255, 255, 1);
            color: #1e293b;
            transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        /* Tarjeta de Contenido - Modo Oscuro */
        html.dark .liquid-card {
            background: rgba(17, 24, 43, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 
                0 4px 16px -2px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
        }

        /* Tarjeta del Asesor (Vendedor) */
        .liquid-card-user {
            background: linear-gradient(135deg, rgba(13, 148, 136, 0.96), rgba(15, 118, 110, 0.94));
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 8px 24px -4px rgba(13, 148, 136, 0.35),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.35);
            color: #ffffff;
        }

        /* Campo de Texto - Modo Claro */
        .liquid-input {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.85);
            box-shadow: inset 0 1px 3px 0 rgba(15, 23, 42, 0.05);
            color: #0f172a;
            transition: all 0.2s ease;
        }
        .liquid-input:focus {
            border-color: rgba(13, 148, 136, 0.6);
            box-shadow: 
                0 0 0 3px rgba(20, 184, 166, 0.18),
                inset 0 1px 2px 0 rgba(15, 23, 42, 0.04);
        }

        /* Campo de Texto - Modo Oscuro */
        html.dark .liquid-input {
            background: rgba(8, 12, 22, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.35);
            color: #f8fafc;
        }
        html.dark .liquid-input:focus {
            border-color: rgba(45, 212, 191, 0.5);
            box-shadow: 
                0 0 0 3px rgba(20, 184, 166, 0.18),
                inset 0 1px 2px 0 rgba(0, 0, 0, 0.2);
        }

        /* Botones Píldora - Modo Claro */
        .liquid-pill {
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.75);
            box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.03), inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
            color: #334155;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .liquid-pill:hover {
            background: rgba(255, 255, 255, 0.98);
            border-color: rgba(20, 184, 166, 0.45);
            color: #0f766e;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px -2px rgba(13, 148, 136, 0.12);
        }

        /* Botones Píldora - Modo Oscuro */
        html.dark .liquid-pill {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
        }
        html.dark .liquid-pill:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(45, 212, 191, 0.3);
            color: #99f6e4;
            transform: translateY(-1px);
            box-shadow: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="h-full flex flex-col antialiased text-slate-800 dark:text-slate-100 transition-colors duration-200" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    {% block content %}{% endblock %}

    <script>
        function scrollChatToBottom(smooth = false) {
            const chatStream = document.getElementById('chat-stream');
            if (chatStream) {
                if (smooth) {
                    chatStream.scrollTo({ top: chatStream.scrollHeight, behavior: 'smooth' });
                } else {
                    chatStream.scrollTop = chatStream.scrollHeight;
                }
            }
        }

        function toggleHintsMenu(forceState) {
            const popover = document.getElementById('hints-popover');
            const chevron = document.getElementById('hints-chevron');
            if (!popover) return;
            const isHidden = popover.classList.contains('hidden');
            const shouldShow = (typeof forceState === 'boolean') ? forceState : isHidden;
            if (shouldShow) {
                popover.classList.remove('hidden');
                if (chevron) chevron.classList.add('rotate-180');
            } else {
                popover.classList.add('hidden');
                if (chevron) chevron.classList.remove('rotate-180');
            }
        }

        document.addEventListener('click', function(e) {
            const popover = document.getElementById('hints-popover');
            const btn = document.getElementById('btn-toggle-hints');
            if (popover && !popover.classList.contains('hidden') && btn) {
                if (!popover.contains(e.target) && !btn.contains(e.target)) {
                    toggleHintsMenu(false);
                }
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            if (isDark) {
                html.classList.remove('dark');
                try { localStorage.setItem('txu_theme', 'light'); } catch(e) {}
                updateThemeUI(false);
            } else {
                html.classList.add('dark');
                try { localStorage.setItem('txu_theme', 'dark'); } catch(e) {}
                updateThemeUI(true);
            }
        }

        function updateThemeUI(isDark) {
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            const themeText = document.getElementById('theme-text');
            const isEn = (document.documentElement.lang || 'es').toLowerCase().startsWith('en');
            if (sunIcon && moonIcon && themeText) {
                if (isDark) {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                    themeText.textContent = isEn ? 'Dark Mode' : 'Modo Oscuro';
                } else {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                    themeText.textContent = isEn ? 'Light Mode' : 'Modo Claro';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            scrollChatToBottom(false);
            updateThemeUI(document.documentElement.classList.contains('dark'));
            if (typeof VoiceIntercom !== 'undefined') {
                if (VoiceIntercom.initOnPageLoad) {
                    VoiceIntercom.initOnPageLoad();
                } else {
                    VoiceIntercom.onChatContentSwapped();
                }
            }
        });

        // Interceptar antes de enviar mensaje por HTMX
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            const targetUrl = evt.detail.requestConfig ? evt.detail.requestConfig.path : '';
            const elt = evt.detail.elt;
            const hxPost = elt ? (elt.getAttribute('hx-post') || '') : '';

            // Solo actuar en envíos de mensajes al simulador
            const isSend = (targetUrl && targetUrl.includes('/send/')) || (hxPost && hxPost.includes('send_message'));
            if (!isSend) return;

            // Detener voz activa previa
            if (typeof VoiceIntercom !== 'undefined') {
                VoiceIntercom.stopListening();
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            }

            // Extraer el texto del mensaje enviado
            let messageText = '';
            if (elt) {
                const input = elt.querySelector('[name="message"]');
                if (input) {
                    messageText = input.value.trim();
                }
            }

            if (!messageText) return;

            const chatStream = document.getElementById('chat-stream');
            if (!chatStream) return;

            const chatCard = document.getElementById('chat-card');
            const residentName = (chatCard && chatCard.dataset.resident) ? chatCard.dataset.resident : 'Residente';

            // Deshabilitar temporalmente controles de envío
            const inputField = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const sendButtonText = document.getElementById('send-button-text');
            const sendButtonIcon = document.getElementById('send-button-icon');
            const suggestionsContainer = document.getElementById('suggestions-container');

            if (inputField) {
                inputField.readOnly = true;
                inputField.classList.add('opacity-70');
            }
            if (sendButton) {
                sendButton.disabled = true;
                if (sendButtonText) sendButtonText.textContent = 'Enviando...';
                if (sendButtonIcon) {
                    sendButtonIcon.innerHTML = `
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    `;
                    sendButtonIcon.classList.add('animate-spin');
                }
            }
            if (suggestionsContainer) {
                suggestionsContainer.classList.add('opacity-40', 'pointer-events-none');
            }

            // 1. Renderizar burbuja inmediata del usuario (Optimistic UI)
            const userBubble = document.createElement('div');
            userBubble.id = 'optimistic-user-message';
            userBubble.className = 'flex items-start justify-end space-x-3 max-w-2xl ml-auto animate-fade-in';
            userBubble.innerHTML = `
                <div class="space-y-1.5 text-right">
                    <span class="text-[11px] font-semibold tracking-wide text-teal-600 dark:text-teal-400">Tú (Asesor de Energía TXU)</span>
                    <div class="liquid-card-user text-white p-4 rounded-2xl rounded-tr-sm text-sm leading-relaxed shadow-lg text-left">
                        ${escapeHtml(messageText)}
                    </div>
                </div>
                <div class="w-9 h-9 rounded-xl bg-teal-500/15 dark:bg-teal-500/20 border border-teal-500/30 text-teal-600 dark:text-teal-300 flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
            `;
            chatStream.appendChild(userBubble);

            // 2. Renderizar indicador de pensamiento del prospecto
            const thinkingBubble = document.createElement('div');
            thinkingBubble.id = 'prospect-thinking-indicator';
            thinkingBubble.className = 'flex items-start space-x-3 max-w-2xl animate-fade-in';
            thinkingBubble.innerHTML = `
                <div class="w-9 h-9 rounded-xl bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-white/10 text-teal-600 dark:text-teal-400 flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm">
                    <svg class="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <div class="space-y-1.5">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-800 dark:text-slate-200">${escapeHtml(residentName)}</span>
                        <span class="text-[10px] text-slate-500 dark:text-slate-400 font-mono px-2 py-0.5 rounded-full bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/5">${(document.documentElement.lang === 'en') ? 'Customer' : 'Residente'}</span>
                        <span class="text-[11px] font-mono text-teal-600 dark:text-teal-400 animate-pulse font-medium">${(document.documentElement.lang === 'en') ? 'thinking...' : 'pensando...'}</span>
                    </div>
                    <div class="liquid-card px-4 py-3.5 rounded-2xl rounded-tl-sm text-sm text-slate-700 dark:text-slate-300 shadow-md flex items-center gap-3">
                        <div class="flex items-center gap-1.5 px-0.5">
                            <span class="w-2 h-2 rounded-full bg-teal-500 dark:bg-teal-400 animate-bounce" style="animation-delay: 0ms; animation-duration: 0.9s;"></span>
                            <span class="w-2 h-2 rounded-full bg-teal-500 dark:bg-teal-400 animate-bounce" style="animation-delay: 180ms; animation-duration: 0.9s;"></span>
                            <span class="w-2 h-2 rounded-full bg-teal-500 dark:bg-teal-400 animate-bounce" style="animation-delay: 360ms; animation-duration: 0.9s;"></span>
                        </div>
                        <span class="text-xs text-slate-600 dark:text-slate-300">${(document.documentElement.lang === 'en') ? 'Listening to proposal and processing objection...' : 'Escuchando propuesta y procesando objeción...'}</span>
                    </div>
                </div>
            `;
            chatStream.appendChild(thinkingBubble);

            scrollChatToBottom(true);
        });

        // Al completarse el intercambio HTMX
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            scrollChatToBottom(true);
            const inputField = document.getElementById('message-input');
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth < 768);
            const isHandsFree = (typeof VoiceIntercom !== 'undefined' && VoiceIntercom.isHandsFreeMode && VoiceIntercom.isHandsFreeMode());

            // Sincronizar lang en <html> si chat-container trae data-lang
            const chatContainer = document.getElementById('chat-container');
            if (chatContainer && chatContainer.getAttribute('data-lang')) {
                document.documentElement.lang = chatContainer.getAttribute('data-lang');
            }

            if (inputField) {
                inputField.readOnly = false;
                inputField.classList.remove('opacity-70');
                inputField.value = '';
                if (!isTouch && !isHandsFree) {
                    inputField.focus();
                } else {
                    inputField.blur();
                }
            }
            if (typeof VoiceIntercom !== 'undefined') {
                VoiceIntercom.onChatContentSwapped();
            }
        });

        // Manejo de error de conexión
        document.body.addEventListener('htmx:responseError', function(evt) {
            const thinking = document.getElementById('prospect-thinking-indicator');
            const isEnglish = (document.documentElement.lang === 'en');
            const errorMsg = isEnglish ? 'Could not obtain response from model. Please verify connection or try again.' : 'No se pudo obtener respuesta del modelo. Verifique la conexión o intente nuevamente.';
            if (thinking) {
                thinking.innerHTML = `
                    <div class="p-3 bg-rose-100 dark:bg-rose-950/80 border border-rose-300 dark:border-rose-800 text-rose-700 dark:text-rose-300 rounded-lg text-xs">
                        ${errorMsg}
                    </div>
                `;
            }
            const inputField = document.getElementById('message-input');
            if (inputField) {
                inputField.readOnly = false;
                inputField.classList.remove('opacity-70');
            }
            const sendButton = document.getElementById('send-button');
            if (sendButton) sendButton.disabled = false;
        });
    </script>
</body>
</html>
